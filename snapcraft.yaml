name: capturist
adopt-info: capturist-part

type: app
base: core24
grade: stable
confinement: strict
platforms:
  amd64:
    build-on:
      - amd64

parts:
  capturist-part:
    plugin: dump
    build-snaps:
      - node/24/stable
      - rustup/latest/stable
    build-packages:
      - libssl-dev
      - desktop-file-utils
    stage-packages:
      - libnotify-bin
    stage:
      - -usr/lib/*/libicuio.so*
      - -usr/lib/*/libicutu.so*
      - -usr/lib/*/libicutest.so*
    source: .
    parse-info:
      - me.ariyadey.capturist.metainfo.xml
    # language=Bash
    override-build: |
      set -euo pipefail

      if [ ! -f "capturist.deb" ]; then
          echo "--- No pre-built deb found, building from source... ---"
          rustup default stable
          npm ci --no-audit --no-fund
          npm run tauri build -- --config src-tauri/tauri.snap.conf.json
          mv src-tauri/target/release/bundle/deb/*.deb capturist.deb
      fi

      dpkg -x capturist.deb "$SNAPCRAFT_PART_INSTALL"/
      # Bare icon name isn't registered by snapd here; point desktop file at the snap's own icon.
      # Kept as a single-quoted literal so ${SNAP} is NOT expanded now — it's expanded by the
      # desktop launcher at runtime on the user's machine, not here at build time.
      DESKTOP_FILE_PATH="$SNAPCRAFT_PART_INSTALL/usr/share/applications/Capturist.desktop"
      RUNTIME_ICON_PATH='${SNAP}/usr/share/icons/hicolor/128x128/apps/capturist.png'
      desktop-file-edit --set-icon="$RUNTIME_ICON_PATH" "$DESKTOP_FILE_PATH"

apps:
  capturist:
    command: usr/bin/capturist
    desktop: usr/share/applications/Capturist.desktop
    extensions:
      # The gnome extension already includes
      # [ desktop, desktop-legacy, gsettings, opengl, wayland, x11, mount-observe, calendar-service ]
      - gnome
    plugs:
      - network
      - network-status
      - password-manager-service
      - single-instance-plug
    slots:
      - single-instance-slot

plugs:
  single-instance-plug:
    interface: dbus
    bus: session
    name: org.me_ariyadey_capturist.SingleInstance

slots:
  single-instance-slot:
    interface: dbus
    bus: session
    name: org.me_ariyadey_capturist.SingleInstance

layout:
  /usr/lib/x86_64-linux-gnu/webkit2gtk-4.1:
    symlink: $SNAP/usr/lib/x86_64-linux-gnu/webkit2gtk-4.1
