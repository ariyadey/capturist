name: "Generate Flatpak Offline Dependency Manifests"
description: "Generates cargo-sources.json and node-sources.json for Flatpak builds"
runs:
  using: "composite"
  steps:
    - name: Generate Flatpak offline dependency manifests
      shell: bash
      # language=BASH
      run: |
        set -euo pipefail

        WORK_DIR=$(mktemp -d)
        trap 'rm -rf "$WORK_DIR"' EXIT

        git clone --depth 1 https://github.com/flatpak/flatpak-builder-tools.git "$WORK_DIR/tools"
        python3 -m pip install --quiet --target "$WORK_DIR/deps" aiohttp tomlkit pyyaml

        mkdir -p flatpak
        export PYTHONPATH="$WORK_DIR/deps:$WORK_DIR/tools/node${PYTHONPATH:+:$PYTHONPATH}"

        python3 "$WORK_DIR/tools/cargo/flatpak-cargo-generator.py" \
          src-tauri/Cargo.lock -o flatpak/cargo-sources.json

        python3 -m flatpak_node_generator \
          npm package-lock.json -o flatpak/node-sources.json
