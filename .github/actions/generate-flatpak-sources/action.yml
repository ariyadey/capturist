name: "Generate Flatpak Offline Dependency Manifests"
description: "Generates cargo-sources.json and node-sources.json for Flatpak builds"
runs:
  using: "composite"
  steps:
    - name: Setup Flatpak generators
      shell: bash
      # language=BASH
      run: |
        GENERATORS_DIR="/tmp/flatpak-generators"
        echo "GENERATORS_DIR=$GENERATORS_DIR" >> $GITHUB_ENV
        if [ ! -d "$GENERATORS_DIR" ]; then
          git clone --depth 1 https://github.com/flatpak/flatpak-builder-tools.git "$GENERATORS_DIR"
        fi
        pip install toml tomlkit aiohttp python-slugify requests pyyaml
        mkdir -p flatpak

    - name: Generate Cargo sources
      shell: bash
      # language=BASH
      run: |
        python3 "$GENERATORS_DIR/cargo/flatpak-cargo-generator.py" \
          "$PWD/src-tauri/Cargo.lock" \
          -o "$PWD/flatpak/cargo-sources.json"

    - name: Generate Node sources
      shell: bash
      # language=BASH
      run: |
        PYTHONPATH="$GENERATORS_DIR/node" python3 -m flatpak_node_generator \
          npm "$PWD/package-lock.json" \
          -o "$PWD/flatpak/node-sources.json"
