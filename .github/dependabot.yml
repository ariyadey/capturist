version: 2

# Tauri ships npm (@tauri-apps/*) and Cargo (tauri*) packages in lockstep, and
# `tauri build` fails if their major.minor drift apart, so update both in one PR.
multi-ecosystem-groups:
  tauri:
    schedule:
      interval: "weekly"
      day: "saturday"
    commit-message:
      prefix: "chore"

updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "saturday"
    commit-message:
      prefix: "chore"
    multi-ecosystem-group: "tauri"
    patterns:
      - "@tauri-apps/*"
    groups:
      angular:
        patterns:
          - "@angular/*"
          - "angular-eslint"
      eslint:
        patterns:
          - "eslint*"
          - "@eslint/*"
          - "typescript-eslint"
      prettier:
        patterns:
          - "prettier*"

  - package-ecosystem: "cargo"
    directory: "/src-tauri"
    schedule:
      interval: "weekly"
      day: "saturday"
    commit-message:
      prefix: "chore"
    multi-ecosystem-group: "tauri"
    patterns:
      - "tauri*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "saturday"
    commit-message:
      prefix: "chore"
